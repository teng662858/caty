# XcodeGen 工程描述 —— 用一条命令生成 Caty.xcodeproj
#
#   brew install xcodegen && cd ios && xcodegen generate
#
# 为什么要用它：工程文件（.xcodeproj）只能由 Xcode 生成，
# 而"没有 Mac"的情况下我们靠 GitHub Actions 的 macOS 机器编译 ——
# 用这份 YAML 让那台机器现场生成工程，就不需要把 .xcodeproj 提交进仓库。
# 以后有 Mac 了，同一条命令也能生成工程，两种路径一致。
#
# 注意：NodeMobile.xcframework 不在仓库里（45 MB+，从国内推上去太慢）。
#   - CI：由 .github/workflows/ios.yml 自动下载到 ios/Frameworks/
#   - 本机（有 Mac）：手动下载后放到 ios/Frameworks/（见 docs/08-P2操作卡.md 第 1 步）
#
# libmpv（播放内核，P6）：用 mpvkit/MPVKit 的**预编译 .xcframework**（LGPL 版），
#   由 ios/scripts/fetch-mpvkit.sh 在 CI 里下载 + sha256 校验后解压到 ios/Frameworks/mpvkit/。
#   为什么不用 SwiftPM：那 28 个二进制包并发下载会稳定报 "already exists in file system"，改确定性脚本。
#   版本清单来自 MPVKit 的 Package.swift（LGPL 目标 _MPVKit + _FFmpeg），已钉死。

name: Caty

options:
  bundleIdPrefix: com.caty
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  # 生成工程**之前**先把 libmpv 的预编译包拉下来（28 个 xcframework，带 sha256 校验）。
  # 放在这里而不是 CI 的 step 里：.github/workflows 受令牌权限限制改不了，
  # 而这一步是 xcodebuild 的前置条件，写在这里既确定又能跟着工程描述一起版本化。
  preGenCommand: "bash scripts/fetch-mpvkit.sh"


settings:
  base:
    SWIFT_VERSION: "5.0"                      # 不要用 Swift 6：严格并发会报一堆错
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"               # 只做 iPhone
    ENABLE_BITCODE: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    ALWAYS_SEARCH_USER_PATHS: "NO"
    CLANG_ENABLE_MODULES: "YES"

targets:
  Caty:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"                      # 它由 INFOPLIST_FILE 引用，不进 Copy Bundle Resources
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_OBJC_BRIDGING_HEADER: Caty-Bridging-Header.h
        PRODUCT_NAME: Caty
        PRODUCT_BUNDLE_IDENTIFIER: com.caty.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # 嵌入动态 framework 后必须能找到它，否则启动就报
        # Library not loaded: @rpath/NodeMobile.framework/NodeMobile
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - framework: Frameworks/NodeMobile.xcframework
        embed: true                            # 等价于 Xcode 里的 Embed & Sign
      - framework: Frameworks/mpvkit/Libmpv.xcframework
      - framework: Frameworks/mpvkit/Libuchardet.xcframework
      - framework: Frameworks/mpvkit/Libbluray.xcframework
      - framework: Frameworks/mpvkit/Libavcodec.xcframework
      - framework: Frameworks/mpvkit/Libavdevice.xcframework
      - framework: Frameworks/mpvkit/Libavfilter.xcframework
      - framework: Frameworks/mpvkit/Libavformat.xcframework
      - framework: Frameworks/mpvkit/Libavutil.xcframework
      - framework: Frameworks/mpvkit/Libswresample.xcframework
      - framework: Frameworks/mpvkit/Libswscale.xcframework
      - framework: Frameworks/mpvkit/Libssl.xcframework
      - framework: Frameworks/mpvkit/Libcrypto.xcframework
      - framework: Frameworks/mpvkit/Libass.xcframework
      - framework: Frameworks/mpvkit/Libfreetype.xcframework
      - framework: Frameworks/mpvkit/Libfribidi.xcframework
      - framework: Frameworks/mpvkit/Libharfbuzz.xcframework
      - framework: Frameworks/mpvkit/MoltenVK.xcframework
      - framework: Frameworks/mpvkit/Libshaderc_combined.xcframework
      - framework: Frameworks/mpvkit/lcms2.xcframework
      - framework: Frameworks/mpvkit/Libplacebo.xcframework
      - framework: Frameworks/mpvkit/Libdovi.xcframework
      - framework: Frameworks/mpvkit/Libunibreak.xcframework
      - framework: Frameworks/mpvkit/gmp.xcframework
      - framework: Frameworks/mpvkit/nettle.xcframework
      - framework: Frameworks/mpvkit/hogweed.xcframework
      - framework: Frameworks/mpvkit/gnutls.xcframework
      - framework: Frameworks/mpvkit/Libdav1d.xcframework
      - framework: Frameworks/mpvkit/Libuavs3d.xcframework
    scheme:
      testTargets: []
